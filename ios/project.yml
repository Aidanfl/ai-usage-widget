# XcodeGen spec for the iOS companion app + home-screen widget.
# Generate the project with:   cd ios && xcodegen generate
# (the .xcodeproj is git-ignored — it is a build artefact of this file)
#
# CI runs:
#   xcodebuild -project AIUsage.xcodeproj -scheme AIUsage -configuration Debug \
#     -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

name: AIUsage

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  # Do not add the bundle-id prefix automatically — every target sets PRODUCT_BUNDLE_IDENTIFIER explicitly.

settings:
  base:
    SWIFT_VERSION: "5.0"                      # Swift 5 language mode (NOT 6 — avoids strict-concurrency errors)
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"               # iPhone only
    # Put your Apple Developer Team ID here (or pick it in Xcode ▸ target ▸ Signing & Capabilities).
    # Left empty on purpose: CI compiles with signing disabled and never needs it.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "NO"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:

  # ---------------------------------------------------------------------------
  # The app: pairing (QR / paste / aiusage:// link), dashboard, history chart, settings.
  # ---------------------------------------------------------------------------
  AIUsage:
    type: application
    platform: iOS
    sources:
      - path: AIUsage
      - path: Shared
    dependencies:
      - target: AIUsageWidget
        embed: true
    entitlements:
      path: AIUsage/AIUsage.entitlements
    info:
      path: AIUsage/Info.plist
      properties:
        CFBundleDisplayName: AI Usage
        CFBundleName: AIUsage
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Scan the pairing code shown by the desktop widget.
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.aidanfl.aiusage
            CFBundleURLSchemes:
              - aiusage
        # AES-GCM is only used to protect the app's own data → exempt from export compliance (see README).
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aidanfl.aiusage
        PRODUCT_NAME: AIUsage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"

  # ---------------------------------------------------------------------------
  # The WidgetKit extension (home screen + lock screen families).
  # ---------------------------------------------------------------------------
  AIUsageWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AIUsageWidget
      - path: Shared
    entitlements:
      path: AIUsageWidget/AIUsageWidget.entitlements
    info:
      path: AIUsageWidget/Info.plist
      properties:
        CFBundleDisplayName: AI Usage
        CFBundleName: AIUsageWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aidanfl.aiusage.widget
        PRODUCT_NAME: AIUsageWidget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

schemes:
  AIUsage:
    shared: true
    build:
      targets:
        AIUsage: all
        AIUsageWidget: all
    run:
      config: Debug
    archive:
      config: Release
